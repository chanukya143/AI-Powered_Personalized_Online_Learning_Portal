# ==============================================================================
# Local Profile: Zero-Setup Embedded Database (File-based H2 in MySQL mode)
# ==============================================================================

spring.datasource.url=jdbc:h2:file:./data/edupulse;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Auto-seed initial courses, lessons, quizzes, admin and student accounts
app.seed-data.enabled=true
