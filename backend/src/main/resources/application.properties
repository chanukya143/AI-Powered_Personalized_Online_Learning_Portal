# Server configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Spring Application
spring.application.name=onlinelearningportal
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Datasource configuration (Aiven MySQL / Local MySQL compatible)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:onlinelearningportal}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&useSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Actuator & Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:c3VwZXJzZWNyZXRqd3RleGFtcGxlZm9yZGV2ZWxvcG1lbnRwdXJwb3Nlc29ubHltaW4zMmJ5dGVzISE}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# AI Learning Assistant Configuration
app.ai.mode=${AI_MODE:mock}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gpt-4o-mini}
app.ai.base-url=${AI_API_BASE_URL:https://api.openai.com/v1}

# Sample Seed Data (Active only in dev/test)
app.seed-data.enabled=${APP_SEED_DATA:true}

# Logging
logging.level.root=${APP_LOG_LEVEL:INFO}
logging.level.com.example.onlinelearningportal=DEBUG
logging.level.org.springframework.security=INFO

# Springdoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
